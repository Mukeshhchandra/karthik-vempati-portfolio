<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local responsive QA</title><style>body{margin:0;padding:15px;background:#dedbd3;font:12px Arial}header{padding-bottom:15px;display:flex;gap:12px;align-items:center}main{display:flex;align-items:flex-start;gap:20px}iframe{border:0;background:#f6f3ed;height:850px;flex-shrink:0}a{color:#222}label{display:block;padding-bottom:8px}section{flex-shrink:0}#metrics{font-size:10px;white-space:pre-wrap}</style></head><body><header><strong>Local layout inspection</strong><a href="?route=/">Home</a><a href="?route=/about/">About</a><a href="?route=/resume/">Résumé</a><a href="?route=/work/levis/">Levi’s</a><a href="?route=/work/plant-stall/">Plant Stall</a><a href="?route=/work/photomax/">Photomax</a><a href="?route=/work/creativepro/">CreativePro</a><a href="?route=/work/mellana/">Mellana</a><a href="?route=/work/prebook/">PREBOOK</a></header><pre id="metrics"></pre><main><section><label>Phone</label><iframe width="390" title="Mobile layout"></iframe></section><section><label>Tablet</label><iframe width="768" title="Tablet layout"></iframe></section></main><script>const params=new URLSearchParams(location.search),route=params.get('route')||'/',frames=[...document.querySelectorAll('iframe')];if(['320','390','640','1280'].includes(params.get('width')))frames[0].width=params.get('width');if(params.get('height')==='600')frames.forEach(f=>f.style.height='600px');const results=[];function measure(f){const doc=f.contentDocument;results.push({route,width:f.contentWindow.innerWidth,clientWidth:doc.documentElement.clientWidth,scrollWidth:doc.documentElement.scrollWidth,h1:doc.querySelector('h1')?.textContent,broken:[...doc.images].filter(i=>i.getAttribute('src')&&i.complete&&!i.naturalWidth).map(i=>i.src)});document.querySelector('#metrics').textContent=JSON.stringify(results);}if(['/','/about/','/resume/','/work/levis/','/work/plant-stall/','/work/photomax/','/work/creativepro/','/work/mellana/','/work/prebook/'].includes(route))frames.forEach(f=>{f.onload=()=>measure(f);f.src=route;});</script></body></html>
